name: CI

on:
  push:
  pull_request:

jobs:
  go-build-and-vet:
    name: Go build & vet & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: master
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go 1.21
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Test (race detector)
        run: go test -race ./...

  python-syntax-check:
    name: Python syntax check (3.11)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: py_compile all .py under scripts/ and examples/
        run: |
          set -e
          found=0
          while IFS= read -r -d '' f; do
            python -m py_compile "$f"
            found=1
          done < <(find scripts examples -name "*.py" -print0)
          if [ "$found" -eq 0 ]; then
            echo "No .py files found under scripts/ or examples/."
            exit 1
          fi
          echo "All Python files compiled successfully."
